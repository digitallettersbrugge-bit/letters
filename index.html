<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Slow Post</title>
<meta name="description" content="A letter that takes as long as a letter takes.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ink: #1B2B44;
    --ink-soft: #6B7C93;
    --paper: #EDF1F5;
    --sheet: #FBFCFD;
    --red: #B32A26;
    --blue: #1F4E9C;
    --rule: #C7D3E0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 2.1rem; line-height: 1.15; letter-spacing: -.01em; margin: 0 0 8px; font-weight: 500; }
  .lede { color: var(--ink-soft); max-width: 62ch; margin: 0 0 34px; line-height: 1.75; }
  .label { font-size: .78rem; color: var(--ink-soft); margin-bottom: 2px; }
  .airmail {
    padding: 7px;
    background-image: repeating-linear-gradient(45deg,
      var(--red) 0 9px, var(--sheet) 9px 18px, var(--blue) 18px 27px, var(--sheet) 27px 36px);
  }
  .sheet { background: var(--sheet); padding: 26px 26px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 24px; }
  .col { flex: 1 1 200px; position: relative; }
  input, textarea {
    width: 100%; background: transparent; border: 0; outline: none;
    color: var(--ink); font-family: inherit; font-size: 1rem;
    border-bottom: 1px solid var(--rule); padding: 6px 0;
  }
  input:focus, textarea:focus { border-bottom-color: var(--blue); }
  ::placeholder { color: #9FB0C2; }
  textarea {
    border-bottom: 0; resize: none; font-size: 1.02rem; line-height: 1.9;
    min-height: 260px; padding-top: 4px;
    background-image: repeating-linear-gradient(var(--sheet) 0 33px, #E8EEF4 33px 34px);
  }
  .picked { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--rule); padding: 6px 0; }
  .dim { color: var(--ink-soft); }
  .small { font-size: .85rem; }
  .opts {
    position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 4px;
    background: var(--sheet); border: 1px solid var(--rule);
    box-shadow: 0 8px 24px rgba(27,43,68,.10);
  }
  .opt { padding: 7px 12px; cursor: pointer; }
  .opt[aria-selected="true"] { background: #E3EAF2; }
  button {
    font-family: inherit; font-size: .95rem; cursor: pointer; border-radius: 2px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--sheet);
    padding: 9px 22px;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  button.link { background: none; border: 0; color: var(--ink-soft); padding: 0; font-size: .85rem; text-decoration: underline; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; }
  .divider { border: 0; border-top: 1px solid var(--rule); margin: 22px 0; }
  .center { text-align: center; }
  .letter { white-space: pre-wrap; line-height: 1.95; font-size: 1.03rem; }
  .linkbox {
    word-break: break-all; font-size: .8rem; color: var(--ink-soft);
    background: #E7EDF3; padding: 12px 14px; max-height: 96px; overflow-y: auto;
  }
  .track { height: 2px; background: var(--rule); position: relative; margin: 22px 0 10px; }
  .track > i { position: absolute; inset: 0 auto 0 0; background: var(--blue); }
  footer { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-soft); font-size: .82rem; line-height: 1.8; }
  a { color: var(--blue); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @keyframes settle { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .settle { animation: settle 420ms ease-out both; }
  @media (prefers-reduced-motion: reduce) { .settle { animation: none; } }
</style>
</head>

/* ================================================================== */
/*  Transit model                                                      */
/* ================================================================== */
const H = 3600000;
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];

function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const tzShift = (c) => Math.round(c.lon / 15) * H;

function closed(ms) {
  const d = new Date(ms);
  if (d.getUTCDay() === 0) return true;
  const k = (d.getUTCMonth() + 1) + "-" + d.getUTCDate();
  return k === "1-1" || k === "5-1" || k === "12-25";
}
const startOfDay = (ms) => { const d = new Date(ms); d.setUTCHours(0,0,0,0); return d.getTime(); };
const atHour = (ms, h, m) => { const d = new Date(ms); d.setUTCHours(h, m || 0, 0, 0); return d.getTime(); };

// Collection: Monday to Saturday, 4 pm.
function nextCollection(ms) {
  let t = ms;
  for (let i = 0; i < 20; i++) {
    if (!closed(t)) { const cut = atHour(t, 16); if (t <= cut) return cut; }
    t = startOfDay(t) + 24 * H;
  }
  return t;
}
// Delivery round: Monday to Saturday, 8:30 am to 1 pm.
function nextDelivery(ms, rnd) {
  let t = ms;
  for (let i = 0; i < 25; i++) {
    if (!closed(t)) {
      const end = atHour(t, 13);
      if (t <= end) {
        const base = Math.max(t, atHour(t, 8, 30));
        return base + rnd() * (end - base);
      }
    }
    t = startOfDay(t) + 24 * H;
  }
  return t;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Computed once when the letter is sealed, then carried in the link.
function route(from, to, sentAt, seed) {
  const rnd = mulberry32(seed);
  const d = haversine(from, to);
  const domestic = from.cc === to.cc;
  const sameCont = from.cont === to.cont;

  let h;
  if (domestic) h = Math.min(14 + d / 55, 48 + d / 150);
  else if (sameCont) h = 30 + d / 45;
  else h = 54 + d / 220;

  if (!domestic && !(from.eu && to.eu)) h += sameCont ? 20 : 34;
  h += 12;
  h *= 0.85 + rnd() * 0.45;

  let incident = null;
  const dice = rnd();
  if (dice < 0.05) {
    h += 36 + rnd() * 72;
    incident = domestic ? "Held up at the sorting centre" : "Held in customs";
  } else if (dice < 0.09) {
    h += 18 + rnd() * 24;
    incident = "Missorted along the way";
  }

  let t = sentAt + tzShift(from);
  const collectedLocal = nextCollection(t);
  t = collectedLocal + h * H;
  t = t - tzShift(from) + tzShift(to);
  const deliveredLocal = nextDelivery(t, rnd);

  return {
    arrivesAt: Math.round(deliveredLocal - tzShift(to)),
    collectedAt: Math.round(collectedLocal - tzShift(from)),
    distance: Math.round(d),
    incident: incident
  };
}

/* -------------------- dates --------------------------------------- */
function fmt(ms, city, withTime) {
  const d = new Date(ms + tzShift(city));
  let s = DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()];
  if (withTime === false) return s;
  return s + ", " + String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
}
function fmtShort(ms, city) {
  const d = new Date(ms + tzShift(city));
  return String(d.getUTCDate()).padStart(2, "0") + "." +
         String(d.getUTCMonth() + 1).padStart(2, "0") + "." +
         String(d.getUTCFullYear()).slice(2);
}
// "Come back tomorrow", and its neighbours.
function waitPhrase(arrivesAt, city) {
  const now = Date.now();
  if (now >= arrivesAt) return "It is here.";
  const nowLocal = startOfDay(now + tzShift(city));
  const arrLocal = new Date(arrivesAt + tzShift(city));
  const dayGap = Math.round((startOfDay(arrLocal.getTime()) - nowLocal) / 86400000);
  if (dayGap <= 0) return "Arriving later this morning.";
  if (dayGap === 1) return "Come back tomorrow morning.";
  if (dayGap <= 6) return "Come back on " + DAYS[arrLocal.getUTCDay()] + " morning.";
  return "Due on " + fmt(arrivesAt, city, false) + ".";
}
function countdown(arrivesAt) {
  const left = arrivesAt - Date.now();
  if (left <= 0) return "";
  const days = Math.floor(left / 86400000);
  const hours = Math.floor((left % 86400000) / H);
  const mins = Math.floor((left % H) / 60000);
  if (days >= 1) return days + "d " + hours + "h remaining";
  if (hours >= 1) return hours + "h " + String(mins).padStart(2, "0") + "m remaining";
  return mins + " minutes remaining";
}

/* -------------------- payload in the URL -------------------------- */
function b64url(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(str) {
  const s = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === "function") {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
    const zipped = new Uint8Array(await new Response(stream).arrayBuffer());
    return "g" + b64url(zipped);
  }
  return "p" + b64url(bytes);
}
async function unpack(str) {
  const mode = str[0], body = unb64url(str.slice(1));
  if (mode === "g") {
    const stream = new Blob([body]).stream().pipeThrough(new DecompressionStream("gzip"));
    const raw = new Uint8Array(await new Response(stream).arrayBuffer());
    return JSON.parse(new TextDecoder().decode(raw));
  }
  return JSON.parse(new TextDecoder().decode(body));
}

/* -------------------- small helpers ------------------------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const km = (n) => Number(n).toLocaleString("en-GB");

// Refuses anything decoded from the link that is not exactly the shape we wrote.
// Every field that reaches the DOM or the crypto must be of the expected type.
function check(L) {
  const num = (v) => typeof v === "number" && Number.isFinite(v);
  const str = (v) => typeof v === "string";
  const obj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const city = (o) => obj(o) && str(o.n) && str(o.c) && num(o.la) && num(o.lo);
  if (!obj(L) || !city(L.a) || !city(L.b) || !str(L.s) || !str(L.r) ||
      !num(L.k) || !num(L.x) || !num(L.d) || (L.i != null && !str(L.i))) {
    throw new Error("bad letter");
  }
  if (L.e != null) {
    if (!obj(L.e) || !str(L.e.s) || !str(L.e.i) || !str(L.e.c) ||
        (L.e.t != null && !num(L.e.t))) throw new Error("bad lock");
  } else if (!str(L.m)) {
    throw new Error("bad body");
  }
  return L;
}

// Rebuilds a full city object from what the link carries.
function cityFrom(o) {
  const meta = Object.prototype.hasOwnProperty.call(COUNTRY, o.c) ? COUNTRY[o.c] : [o.c, "EU", 0];
  return { name: o.n, cc: o.c, lat: o.la, lon: o.lo,
           country: meta[0], cont: meta[1], eu: !!meta[2] };
}

/* -------------------- optional lock ------------------------------- */
const PBKDF2_ITERATIONS = 600000;       // links sealed before this change carry no "t" and used 150000
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function lockText(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, PBKDF2_ITERATIONS);
  const ct = new Uint8Array(await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text)));
  return { s: b64url(salt), i: b64url(iv), c: b64url(ct), t: PBKDF2_ITERATIONS };
}
async function unlockText(box, pass) {
  const key = await deriveKey(pass, unb64url(box.s), box.t || 150000);
  const raw = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: unb64url(box.i) }, key, unb64url(box.c));
  return new TextDecoder().decode(raw);
}

function postmarkSVG(city, date, size) {
  const s = size || 96, r = s / 2 - 3, c = s / 2;
  let lines = "";
  for (let i = 0; i < 3; i++) {
    lines += '<line x1="' + (c - 22) + '" x2="' + (c + 22) + '" y1="' + (c - 6 + i * 6) +
             '" y2="' + (c - 6 + i * 6) + '" stroke="var(--red)" stroke-width=".8"/>';
  }
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s +
    '" aria-hidden="true" style="opacity:.62;transform:rotate(-8deg)">' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--red)" stroke-width="1.6"/>' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + (r - 5) + '" fill="none" stroke="var(--red)" stroke-width=".7"/>' +
    lines +
    '<text x="' + c + '" y="' + (c - 12) + '" text-anchor="middle" fill="var(--red)" style="font:600 ' +
      (s * 0.1) + 'px Palatino,Georgia,serif;letter-spacing:.08em">' + esc(city.slice(0, 14).toUpperCase()) + '</text>' +
    '<text x="' + c + '" y="' + (c + 24) + '" text-anchor="middle" fill="var(--red)" style="font:' +
      (s * 0.1) + 'px Palatino,Georgia,serif;letter-spacing:.06em">' + esc(date) + '</text></svg>';
}

/* ================================================================== */
/*  City picker                                                        */
/* ================================================================== */
function cityPicker(root, label, placeholder, onPick, initial) {
  let chosen = initial || null, cursor = 0, matches = [];

  function render() {
    if (chosen) {
      root.innerHTML = '<div class="label">' + label + '</div>' +
        '<div class="picked"><span>' + esc(chosen.name) +
        '<span class="dim small"> · ' + esc(chosen.country) + '</span></span>' +
        '<button class="link" type="button" data-clear>change</button></div>';
      $("[data-clear]", root).onclick = function () { chosen = null; onPick(null); render(); };
      return;
    }
    root.innerHTML = '<div class="label">' + label + '</div>' +
      '<input type="text" autocomplete="off" placeholder="' + esc(placeholder) + '">' +
      '<div class="opts" hidden></div>';
    const input = $("input", root), list = $(".opts", root);

    function search(q) {
      const n = norm(q.trim());
      if (!n) return [];
      const starts = [], has = [];
      for (const c of CITIES) {
        const cn = norm(c.name);
        if (cn.indexOf(n) === 0) starts.push(c);
        else if (cn.indexOf(n) > -1 || norm(c.country).indexOf(n) === 0) has.push(c);
        if (starts.length > 7) break;
      }
      return starts.concat(has).slice(0, 7);
    }
    function paint() {
      if (!matches.length) { list.hidden = true; return; }
      list.hidden = false;
      list.innerHTML = matches.map(function (c, i) {
        return '<div class="opt" role="option" aria-selected="' + (i === cursor) + '" data-i="' + i + '">' +
          esc(c.name) + '<span class="dim small"> · ' + esc(c.country) + '</span></div>';
      }).join("");
      Array.prototype.forEach.call(list.children, function (el) {
        el.onmousedown = function () { pick(matches[+el.dataset.i]); };
      });
    }
    function pick(c) { chosen = c; onPick(c); render(); }

    input.oninput = function () { matches = search(input.value); cursor = 0; paint(); };
    input.onblur = function () { setTimeout(function () { list.hidden = true; }, 120); };
    input.onfocus = function () { if (matches.length) list.hidden = false; };
    input.onkeydown = function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor + 1, matches.length - 1); paint(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor - 1, 0); paint(); }
      else if (e.key === "Enter" && matches[cursor]) { e.preventDefault(); pick(matches[cursor]); }
      else if (e.key === "Escape") list.hidden = true;
    };
  }
  render();
}

function viewCompose(pre) {

  app.innerHTML =

    '<p class="lede">Write a letter, and it travels the way letters travel. ' +
    'You get a link to send. It opens on nothing but a sealed envelope until the morning it arrives.</p>' +
    '<div class="airmail"><div class="sheet">' +
      '<div class="row"><div class="col" id="from"></div><div class="col" id="to"></div></div>' +
      '<div class="row">' +
        '<div class="col"><div class="label">From</div><input id="sender" placeholder="your name"></div>' +
        '<div class="col"><div class="label">To</div><input id="recipient" placeholder="their name"></div>' +
      '</div>' +
      '<div class="row"><div class="col">' +
        '<div class="label">Lock with a phrase — optional</div>' +
        '<input id="lock" placeholder="a few words only the two of you know">' +
      '</div><div class="col"></div></div>' +
      '<hr class="divider">' +
      '<textarea id="body" placeholder="Pick the city you are writing from first."></textarea>' +
      '<div class="foot">' +
        '<div class="dim small" id="estimate" style="line-height:1.6">Travel time depends on distance, working days and luck.</div>' +
        '<button id="seal" disabled>Seal the letter</button>' +
      '</div>' +
    '</div></div>' +
    '<footer>Everything stays in this page. The letter is carried inside the link you send, ' +
    'so nothing is stored anywhere and nobody but the two of you ever holds it.</footer>';

  const state = { from: pre.from || null, to: pre.to || null };

  function refresh() {
    const body = $("#body").value.trim();
    const ok = state.from && state.to && $("#sender").value.trim() && $("#recipient").value.trim() && body;
    $("#seal").disabled = !ok;
    if (state.from) {
      $("#body").placeholder = state.from.name + ", " + fmt(Date.now(), state.from, false) + "\n\nDear…";
    }
    if (state.from && state.to) {
      const p = route(state.from, state.to, Date.now(), 1);
      $("#estimate").innerHTML = esc(state.from.name) + " &rarr; " + esc(state.to.name) +
        " · " + km(p.distance) + " km<br>should arrive around " + esc(fmt(p.arrivesAt, state.to, false));
    }
  }

  cityPicker($("#from"), "Posting from", "Ajaccio, Geneva, Tokyo…",
    function (c) { state.from = c; refresh(); }, state.from);
  cityPicker($("#to"), "Going to", "Where should it land?",
    function (c) { state.to = c; refresh(); }, state.to);
  if (pre.sender) $("#sender").value = pre.sender;
  if (pre.recipient) $("#recipient").value = pre.recipient;
  $("#sender").oninput = refresh;
  $("#recipient").oninput = refresh;
  $("#body").oninput = refresh;
  refresh();
  if (pre.from) $("#body").focus();

  $("#seal").onclick = async function () {
    const now = Date.now();
    const id = now.toString(36) + Math.random().toString(36).slice(2, 8);
    let seed = 7;
    for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
    const r = route(state.from, state.to, now, seed);
    const letter = {
      v: 1,
      a: { n: state.from.name, c: state.from.cc, la: state.from.lat, lo: state.from.lon },
      b: { n: state.to.name, c: state.to.cc, la: state.to.lat, lo: state.to.lon },
      s: $("#sender").value.trim(),
      r: $("#recipient").value.trim(),
      k: r.collectedAt,
      x: r.arrivesAt,
      d: r.distance,
      i: r.incident
    };
    const word = $("#lock").value.trim();
    if (word) letter.e = await lockText($("#body").value, word);
    else letter.m = $("#body").value;
    const link = location.href.split("#")[0] + "#" + (await pack(letter));
    viewSealed(letter, link);
  };
}

function icsHref(letter, to) {
  const d = new Date(letter.x);
  const stamp = (t) => t.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const body = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//The Slow Post//EN", "BEGIN:VEVENT",
    "UID:" + letter.x + "@slowpost",
    "DTSTAMP:" + stamp(new Date()),
    "DTSTART:" + stamp(d),
    "DTEND:" + stamp(new Date(letter.x + 30 * 60000)),
    "SUMMARY:A letter arrives from " + letter.s,
    "DESCRIPTION:Posted in " + letter.a.n + ". Open the link you were sent.",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(body);
}

function viewLetter(letter) {
  const from = cityFrom(letter.a);
  const to = cityFrom(letter.b);
  const app = $("#app");
  let text = letter.e ? null : letter.m;
  let wrong = false;

  function paint() {
    const arrived = Date.now() >= letter.x;
    const span = letter.x - letter.k;
    const done = Math.max(2, Math.min(100, 100 * (Date.now() - letter.k) / span));

    app.innerHTML = '<div class="settle">' +
      '<div class="airmail"><div class="sheet">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">' +
          '<div style="line-height:1.7">' +
            '<div style="font-size:1.05rem">' + (arrived ? "From " + esc(letter.s) + ", in " + esc(from.name)
                                                         : "A letter for " + esc(letter.r)) + '</div>' +
            '<div class="dim small">' + esc(from.name) + ' &rarr; ' + esc(to.name) + ' · ' + km(letter.d) + ' km' +
              ' · posted ' + esc(fmt(letter.k, from, false)) + '</div>' +
          '</div>' +
          postmarkSVG(from.name, fmtShort(letter.k, from), 78) +
        '</div>' +
        (arrived && text !== null
          ? '<hr class="divider"><div class="letter">' + esc(text) + '</div>'
          : arrived
          ? '<hr class="divider">' +
            '<p style="margin:0 0 8px">This one is locked. Type the word ' + esc(letter.s) + ' chose.</p>' +
            '<div class="foot" style="margin-top:8px">' +
              '<input id="word" type="password" placeholder="the word" style="flex:1 1 200px">' +
              '<button id="open">Open it</button></div>' +
            (wrong ? '<p class="small" style="margin:14px 0 0;color:var(--red)">' +
              'That word does not open it. Try again, or ask ' + esc(letter.s) + '.</p>' : '')
          : '<div class="track"><i style="width:' + done + '%"></i></div>' +
            '<p style="font-size:1.15rem;margin:14px 0 4px">' + esc(waitPhrase(letter.x, to)) + '</p>' +
            '<p class="dim small" style="margin:0">' + esc(countdown(letter.x)) +
              (letter.i ? ' · ' + esc(letter.i) : '') + '</p>' +
            '<p class="dim small" style="margin:20px 0 0">Due ' + esc(fmt(letter.x, to)) + ', ' +
              esc(to.name) + ' time. <a href="' + icsHref(letter, to) +
              '" download="letter.ics">Add a reminder</a></p>') +
      '</div></div>' +
      (arrived && text !== null
        ? '<div style="margin-top:22px"><button class="ghost" id="reply">Write back to ' +
          esc(letter.s) + '</button></div>'
        : '') +
      '<footer>Letters are not delivered on Sundays. Keep this link — it is the only copy.</footer>' +
      '</div>';

    if ($("#open")) {
      const attempt = async function () {
        const word = $("#word").value.trim();
        if (!word) return;
        try { text = await unlockText(letter.e, word); wrong = false; }
        catch (err) { wrong = true; }
        paint();
      };
      $("#open").onclick = attempt;
      $("#word").onkeydown = function (e) { if (e.key === "Enter") attempt(); };
      $("#word").focus();
    }
    if ($("#reply")) {
      $("#reply").onclick = function () {
        history.replaceState(null, "", location.pathname);
        viewCompose({ from: to, to: from, sender: letter.r, recipient: letter.s });
      };
    }
  }

  paint();
  if (Date.now() < letter.x) {
    const timer = setInterval(function () {
      paint();
      if (Date.now() >= letter.x) clearInterval(timer);
    }, 30000);
  }
}

function viewBroken() {
  $("#app").innerHTML = '<h1>The Slow Post</h1>' +
    '<p class="lede">This link is damaged — most likely it was cut short somewhere along the way. ' +
    'Ask whoever sent it to send the whole thing again.</p>' +
    '<button class="ghost" onclick="location.hash=\'\';location.reload()">Write a letter instead</button>';
}

/* ================================================================== */
(async function start() {
  const hash = location.hash.slice(1);
  if (!hash) { viewCompose(); return; }
  try { viewLetter(check(await unpack(hash))); }
  catch (e) { viewBroken(); }
})();
</script>
</body>
</html>
